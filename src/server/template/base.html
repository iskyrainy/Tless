<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if title %}{{ title }} · {% endif %}{{ site.config.title }}</title>
    <meta name="description" content="{{ site.config.description }}">
    {% if site.config.favicon %}<link rel="icon" href="{{ site.config.favicon }}">{% endif %}
    <link rel="alternate" type="application/atom+xml" href="/atom.xml" title="{{ site.config.title }}">
    <script>
    (() => document.documentElement.dataset.theme = localStorage.getItem('tless-theme')
        || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'))();
    </script>
    <link rel="stylesheet" href="/assets/style.css">
    <link rel="stylesheet" href="/assets/highlight.css">
</head>
<body>
<header class="nav">
    <div class="nav-inner">
        <div class="site-name"><a href="/">{{ site.config.title }}</a></div>
        <nav class="nav-links">
            {% for item in site.config.menu %}<a href="{{ item.link }}">{{ item.name }}</a>{% endfor %}
            <a href="/atom.xml">RSS</a>
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle theme">
                <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
                <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
        </nav>
    </div>
</header>
<main class="main">
{% block main %}{% endblock main %}
</main>
<footer class="footer">
    <span>© {{ site.config.rights }}</span>
</footer>
<script>
const toggleTheme = () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('tless-theme', next);
};
document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
</script>
<script defer src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/highlight.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    if (window.hljs) {
        document.querySelectorAll('pre code').forEach((el) => window.hljs.highlightElement(el));
    }
});
</script>
</body>
</html>
